# Render Blueprint — deploys the "امپراتوری چوسان" game as one hosted web
# service with a permanent URL. See game/README.md for the click-by-click
# deploy guide (no terminal, no local install needed).
services:
  - type: web
    name: joseon-empire
    runtime: node
    plan: free
    buildCommand: cd game/client && npm install && npm run build && cd ../server && npm install
    startCommand: node game/server/src/index.js
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_MAX_TOKENS
        value: "4096"
      # Persistent game-state storage (Upstash Redis, free tier) — without
      # these, the game still runs but falls back to local disk, which
      # Render's free plan wipes on every deploy. See game/README.md.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
